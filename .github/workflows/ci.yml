name: CI

on:
  pull_request:
    paths:
      - "vnr-spst/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "vnr-spst/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: vnr-spst

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vnr-spst/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build succeeds without real secrets.
          # Runtime config still comes from Vercel env vars at deploy time.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
